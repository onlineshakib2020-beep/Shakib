    <script>
      (function () {
        var NativeWS = window.WebSocket;
        if (NativeWS) {
          var MockViteWS = function (url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && url.indexOf('token=') !== -1 && url.indexOf('/live') === -1);
            if (!isViteHmr) {
              return protocols !== undefined ? new NativeWS(url, protocols) : new NativeWS(url);
            }
            var target = new EventTarget();
            target.url = url;
            target.protocol = 'vite-hmr';
            target.readyState = 1;
            target.CONNECTING = 0;
            target.OPEN = 1;
            target.CLOSING = 2;
            target.CLOSED = 3;
            target.send = function () {};
            target.close = function () {};
            return target;
          };
          MockViteWS.prototype = NativeWS.prototype;
          MockViteWS.CONNECTING = 0;
          MockViteWS.OPEN = 1;
          MockViteWS.CLOSING = 2;
          MockViteWS.CLOSED = 3;
          window.WebSocket = MockViteWS;
        }
        var isWsErr = function (v) {
          var s = (v && (v.message || (v.reason && v.reason.message) || String(v))) || '';
          return (
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1
          );
        };
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (isWsErr(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (e) {
            if (isWsErr(e.error) || isWsErr(e.message)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        var origErr = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsErr(arguments[i])) return;
          }
          return origErr.apply(console, arguments);
        };
      })();
    </script>
